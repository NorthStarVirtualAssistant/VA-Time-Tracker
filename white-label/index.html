<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Time Tracker</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏱</text></svg>">
  <style>
    :root {
      --bg: #f7f8fa;
      --surface: #ffffff;
      --surface2: #f0f2f5;
      --border: #e1e4e8;
      --text: #1a1d23;
      --text2: #6b7280;
      --text3: #9ca3af;
      --primary: #2E75B6;
      --primary-dark: #1F5C99;
      --primary-bg: #eef2ff;
      --accent: #6366f1;
      --accent-bg: #eef2ff;
      --green: #10b981;
      --green-bg: #ecfdf5;
      --red: #ef4444;
      --red-bg: #fef2f2;
      --orange: #f59e0b;
      --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,.07), 0 2px 4px -1px rgba(0,0,0,.05);
      --radius: 10px;
      --radius-sm: 6px;
    }
    [data-theme="dark"] {
      --bg: #0f1117;
      --surface: #1a1d26;
      --surface2: #22263a;
      --border: #2d3148;
      --text: #e8eaf0;
      --text2: #9ca3b8;
      --text3: #6b7280;
      --primary: #2E75B6;
      --primary-dark: #5B9FD8;
      --primary-bg: #1e2a3f;
      --accent: #818cf8;
      --accent-bg: #1e1f3a;
      --green: #34d399;
      --green-bg: #0d2e23;
      --red: #f87171;
      --red-bg: #2d1515;
      --shadow: 0 1px 3px rgba(0,0,0,.3), 0 1px 2px rgba(0,0,0,.2);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,.25), 0 2px 4px -1px rgba(0,0,0,.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      font-size: 14px;
    }

    .app-shell { display: flex; min-height: 100vh; }

    .sidebar {
      width: 220px;
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 100;
    }

    .main {
      flex: 1;
      margin-left: 220px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .sidebar-logo {
      padding: 20px 18px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
      min-height: 80px;
      flex-wrap: wrap;
    }

    .logo-mark {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .logo-image {
      width: 40px; height: 40px;
      object-fit: contain;
      border-radius: 6px;
      flex-shrink: 0;
    }

    .logo-text { font-weight: 700; font-size: 15px; color: var(--text); }
    .logo-sub { font-size: 11px; color: var(--text2); }

    .sidebar-nav { flex: 1; padding: 12px 10px; overflow-y: auto; }

    .nav-section { margin-bottom: 20px; }
    .nav-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: var(--text3);
      padding: 0 8px;
      margin-bottom: 4px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      color: var(--text2);
      font-size: 13.5px;
      font-weight: 500;
      transition: background .15s, color .15s;
      user-select: none;
    }
    .nav-item:hover { background: var(--surface2); color: var(--text); }
    .nav-item.active { background: var(--primary-bg); color: var(--primary); }
    .nav-item .icon { font-size: 16px; width: 18px; text-align: center; }

    .sidebar-footer {
      padding: 12px 10px;
      border-top: 1px solid var(--border);
    }

    .footer-button {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      color: var(--text2);
      font-size: 13px;
      font-weight: 500;
      transition: background .15s;
      background: transparent;
      border: none;
      width: 100%;
      justify-content: flex-start;
      margin-bottom: 6px;
    }
    .footer-button:hover { background: var(--surface2); }

    .theme-toggle {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      color: var(--text2);
      font-size: 13px;
      font-weight: 500;
      transition: background .15s;
    }
    .theme-toggle:hover { background: var(--surface2); }

    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 90;
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; }
    .page-title { font-size: 17px; font-weight: 700; }

    .timer-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: 6px 14px 6px 10px;
    }
    .timer-bar.running { background: var(--green-bg); border-color: var(--green); }
    .timer-display {
      font-size: 18px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      min-width: 72px;
    }
    .timer-bar.running .timer-display { color: var(--green); }

    .content { flex: 1; padding: 24px; max-width: 1200px; width: 100%; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 16px;
      height: 38px;
      border-radius: var(--radius-sm);
      border: none;
      cursor: pointer;
      font-size: 13.5px;
      font-weight: 600;
      transition: opacity .15s, transform .1s;
      white-space: nowrap;
    }
    .btn:hover { opacity: .88; }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: var(--primary); color: white; }
    .btn-green { background: var(--green); color: white; }
    .btn-red { background: var(--red); color: white; }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text2); }
    .btn-ghost:hover { background: var(--surface2); color: var(--text); }
    .btn-sm { height: 30px; padding: 0 10px; font-size: 12px; }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }
    .stat-card {
      padding: 18px 20px;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--border);
    }
    .stat-label { font-size: 12px; color: var(--text2); font-weight: 500; text-transform: uppercase; }
    .stat-value { font-size: 28px; font-weight: 700; margin-top: 4px; }

    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
      width: 100%;
      max-width: 600px;
      overflow: auto;
      max-height: 90vh;
    }
    .modal-header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-header h3 { font-size: 16px; font-weight: 700; }
    .modal-body { padding: 20px; }
    .modal-footer {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .form-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 16px; }
    .form-group label { font-size: 12px; font-weight: 600; color: var(--text2); }
    .form-group input, .form-group select, .form-group textarea {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      font-size: 13.5px;
      background: var(--surface);
      color: var(--text);
      outline: none;
      transition: border-color .15s;
      font-family: inherit;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--primary); }

    .logo-preview {
      width: 100%;
      height: 60px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: var(--text2);
      overflow: hidden;
    }
    .logo-preview img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .file-input-wrapper {
      position: relative;
      overflow: hidden;
    }
    .file-input-wrapper input[type="file"] {
      position: absolute;
      left: -9999px;
    }

    .settings-preview {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-top: 16px;
    }
    .preview-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .preview-logo {
      width: 32px; height: 32px;
      object-fit: contain;
      border-radius: 4px;
    }
    .preview-name { font-weight: 700; color: var(--text); }

    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--text2);
    }
    .empty-state .empty-icon { font-size: 40px; margin-bottom: 12px; }
    .empty-state h3 { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 6px; }

    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .section-title { font-size: 16px; font-weight: 700; }

    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); transition: transform .2s; }
      .sidebar.open { transform: translateX(0); }
      .main { margin-left: 0; }
    }

    @media print {
      .sidebar, .topbar, .btn, .sidebar-footer { display: none !important; }
      .main { margin-left: 0 !important; }
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <script>
const STATE_KEY = 'ctt_timetracker_v1';
const CUSTOM_KEY = 'ctt_customization';

let state = {
  clients: [],
  projects: [],
  tasks: [],
  entries: [],
  timer: { running: false, startMs: null, entryId: null },
  theme: 'light',
  isPremium: false,
};

let customization = {
  companyName: 'Client Time Tracker',
  logoImage: null,
};

const COLORS = ['#2E75B6','#6366f1','#10b981','#f59e0b','#ef4444','#0ea5e9','#8b5cf6','#ec4899','#14b8a6','#f97316'];

function load() {
  try {
    const raw = localStorage.getItem(STATE_KEY);
    if (raw) Object.assign(state, JSON.parse(raw));
  } catch {}
  try {
    const custom = localStorage.getItem(CUSTOM_KEY);
    if (custom) Object.assign(customization, JSON.parse(custom));
  } catch {}
  ['clients','projects','tasks','entries'].forEach(k => { if (!Array.isArray(state[k])) state[k] = []; });
  if (!state.timer) state.timer = { running: false, startMs: null, entryId: null };
  if (!state.theme) state.theme = 'light';
  if (state.timer.running) {
    const entry = state.entries.find(e => e.id === state.timer.entryId);
    if (!entry || !state.timer.startMs) {
      state.timer = { running: false, startMs: null, entryId: null };
    }
  }
}

function save() {
  localStorage.setItem(STATE_KEY, JSON.stringify(state));
}

function saveCustomization() {
  localStorage.setItem(CUSTOM_KEY, JSON.stringify(customization));
  updateBranding();
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function updateBranding() {
  const logoMark = document.querySelector('.logo-mark');
  const logoImg = document.querySelector('.logo-image');
  const logoText = document.querySelector('.logo-text');

  if (customization.logoImage && logoImg) {
    logoImg.src = customization.logoImage;
    logoImg.style.display = 'block';
    if (logoMark) logoMark.style.display = 'none';
  } else {
    if (logoImg) logoImg.style.display = 'none';
    if (logoMark) logoMark.style.display = 'flex';
  }

  if (logoText) {
    logoText.textContent = customization.companyName || 'Client Time Tracker';
  }
}

let timerInterval = null;

function timerStart(desc, clientId, projectId, taskId) {
  if (state.timer.running) timerStop();
  const id = uid();
  const now = Date.now();
  state.entries.push({
    id, desc: desc || 'Untitled',
    clientId: clientId || null,
    projectId: projectId || null,
    taskId: taskId || null,
    startMs: now, endMs: null,
    manual: false,
  });
  state.timer = { running: true, startMs: now, entryId: id };
  save();
  renderTopbar();
  startTimerInterval();
  renderCurrentView();
}

function timerStop() {
  if (!state.timer.running) return;
  const entry = state.entries.find(e => e.id === state.timer.entryId);
  if (entry) entry.endMs = Date.now();
  state.timer = { running: false, startMs: null, entryId: null };
  save();
  clearInterval(timerInterval);
  timerInterval = null;
  renderTopbar();
  renderCurrentView();
}

function startTimerInterval() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    renderTopbarTimer();
  }, 1000);
}

function formatMs(ms) {
  if (ms < 0) ms = 0;
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

function formatDuration(ms) {
  if (!ms || ms <= 0) return '0:00';
  const totalMin = Math.floor(ms / 60000);
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  return h > 0 ? `${h}h ${String(m).padStart(2,'0')}m` : `${m}m`;
}

function entryDuration(e) {
  if (e.endMs) return e.endMs - e.startMs;
  if (state.timer.running && e.id === state.timer.entryId) return Date.now() - e.startMs;
  return 0;
}

function getClient(id) { return state.clients.find(c => c.id === id); }
function getProject(id) { return state.projects.find(p => p.id === id); }
function getTask(id) { return state.tasks.find(t => t.id === id); }
function clientName(id) {
  const c = getClient(id);
  if (!c) return '—';
  if (c.firstName || c.lastName) return `${(c.firstName || '').trim()} ${(c.lastName || '').trim()}`.trim() || '—';
  return c.name || '—';
}
function projectName(id) { const p = getProject(id); return p ? p.name : '—'; }
function taskName(id) { const t = getTask(id); return t ? t.name : '—'; }
function clientColor(id) { const c = getClient(id); return c ? c.color : '#9ca3af'; }
function projectColor(id) { const p = getProject(id); return p ? p.color : '#9ca3af'; }

function weekStart(date) {
  const d = new Date(date);
  d.setHours(0,0,0,0);
  const day = d.getDay();
  d.setDate(d.getDate() - (day === 0 ? 6 : day - 1));
  return d;
}

function weekEnd(d) {
  const e = new Date(weekStart(d));
  e.setDate(e.getDate() + 6);
  e.setHours(23,59,59,999);
  return e;
}

function monthStart(date) {
  const d = new Date(date);
  d.setHours(0,0,0,0);
  d.setDate(1);
  return d;
}

function monthEnd(date) {
  const d = new Date(date);
  d.setHours(23,59,59,999);
  d.setMonth(d.getMonth() + 1);
  d.setDate(0);
  return d;
}

function sameDay(a, b) {
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}

function formatDate(ms) {
  const d = new Date(ms);
  return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
}

function formatTime(ms) {
  return new Date(ms).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
}

function todayMs() {
  const now = new Date();
  now.setHours(0,0,0,0);
  return now.getTime();
}

function entryMetaLine(e) {
  const parts = [];
  if (e.clientId) parts.push(clientName(e.clientId));
  if (e.projectId) parts.push(projectName(e.projectId));
  if (e.taskId) parts.push(taskName(e.taskId));
  return parts.join(' › ') || 'No project';
}

function entryRowHTML(e) {
  return `<div style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:6px;background:var(--surface2);margin-bottom:8px" data-entry-id="${e.id}">
    <span style="width:10px;height:10px;border-radius:50%;background:${clientColor(e.clientId)};flex-shrink:0"></span>
    <div style="flex:1">
      <div style="font-size:13px;font-weight:600">${e.desc || 'Untitled'}</div>
      <div style="font-size:11px;color:var(--text2);margin-top:2px">${entryMetaLine(e)}</div>
    </div>
    <div style="text-align:right">
      <div style="font-size:12px;color:var(--text2)">${formatTime(e.startMs)}</div>
      <div style="font-weight:700;font-size:13px;margin-top:2px" class="entry-duration">${formatDuration(entryDuration(e))}</div>
    </div>
    <button class="btn btn-ghost btn-sm" onclick="openEntryModal('${e.id}')" style="padding:4px 8px;font-size:11px">Edit</button>
    <button class="btn btn-ghost btn-sm" onclick="deleteEntry('${e.id}')" style="padding:4px 8px;font-size:11px;color:var(--red)">Delete</button>
  </div>`;
}

function quickTimerHTML() {
  const running = state.timer.running;
  const runEntry = running ? state.entries.find(e=>e.id===state.timer.entryId) : null;
  return `
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:20px">
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:12px">
        <div style="display:flex;flex-direction:column;gap:4px">
          <label style="font-size:11px;font-weight:600;color:var(--text2)">Description</label>
          <input id="qt-desc" type="text" placeholder="What are you working on?" value="${running ? (runEntry?.desc||'') : ''}" ${running?'disabled':''} style="border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:13px;background:var(--surface);color:var(--text);outline:none">
        </div>
        <div style="display:flex;flex-direction:column;gap:4px">
          <label style="font-size:11px;font-weight:600;color:var(--text2)">Client</label>
          <select id="qt-client" ${running?'disabled':''} onchange="updateQTProjects()" style="border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:13px;background:var(--surface);color:var(--text);outline:none">
            <option value="">No Client</option>
            ${state.clients.map(c=>`<option value="${c.id}">${clientName(c.id)}</option>`).join('')}
          </select>
        </div>
        <div style="display:flex;flex-direction:column;gap:4px">
          <label style="font-size:11px;font-weight:600;color:var(--text2)">Project</label>
          <select id="qt-project" ${running?'disabled':''} style="border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:13px;background:var(--surface);color:var(--text);outline:none">
            <option value="">No Project</option>
            ${state.projects.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}
          </select>
        </div>
        <div style="display:flex;flex-direction:column;gap:4px">
          <label style="font-size:11px;font-weight:600;color:var(--text2)">Task</label>
          <select id="qt-task" ${running?'disabled':''} style="border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:13px;background:var(--surface);color:var(--text);outline:none">
            <option value="">No Task</option>
            ${state.tasks.map(t=>`<option value="${t.id}">${t.name}</option>`).join('')}
          </select>
        </div>
      </div>
      <div style="display:flex;gap:12px">
        <button class="btn ${running ? 'btn-red' : 'btn-green'}" onclick="${running ? 'timerStop();renderTracker()' : 'quickTimerStart()'}" style="flex:1;justify-content:center">
          ${running ? '⏹ Stop Timer' : '▶ Start Timer'}
        </button>
        <button class="btn btn-ghost" onclick="openManualEntry()">+ Manual Entry</button>
      </div>
    </div>
  `;
}

function quickTimerStart() {
  const desc = document.getElementById('qt-desc')?.value || 'Untitled';
  const clientId = document.getElementById('qt-client')?.value || null;
  const projectId = document.getElementById('qt-project')?.value || null;
  const taskId = document.getElementById('qt-task')?.value || null;
  timerStart(desc, clientId, projectId, taskId);
}

function updateQTProjects() {
  const clientId = document.getElementById('qt-client')?.value;
  const projects = clientId ? state.projects.filter(p => p.clientId === clientId) : state.projects;
  const projectSelect = document.getElementById('qt-project');
  if (projectSelect) {

  const clientId = document.getElementById('me-client')?.value || null;
  const projectId = document.getElementById('me-project')?.value || null;

  const dateStr = document.getElementById('me-date')?.value;
  const startStr = document.getElementById('me-start')?.value;
  const endStr = document.getElementById('me-end')?.value;

  if (!dateStr || !startStr || !endStr) return alert('Date and times are required.');

  const startMs = new Date(`${dateStr}T${startStr}`).getTime();
  const endMs = new Date(`${dateStr}T${endStr}`).getTime();

  if (endMs <= startMs) return alert('End time must be after start time.');

  state.entries.push({
    id: uid(),
    desc, clientId, projectId, taskId,
    startMs, endMs, manual: true
  });
  save();
  closeModal();
  renderTracker();
}

function exportData() {
  const dataStr = JSON.stringify(state, null, 2);
  const filename = `ctt-backup-${new Date().toISOString().slice(0,10)}.json`;
  if (window.claude?.downloads?.save) {
    window.claude.downloads.save(dataStr, filename);
    alert('Data exported successfully!');
  } else {
    const blob = new Blob([dataStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
    alert('Data exported successfully!');
  }
}

function importData() {
  const json = prompt('Paste your exported data (JSON):');
  if (!json) return;
  try {
    const imported = JSON.parse(json);
    if (imported.clients && imported.projects && imported.tasks && imported.entries) {
      Object.assign(state, imported);
      save();
      alert('Data imported successfully! Reloading...');
      location.reload();
    } else {
      alert('Invalid data format. Make sure you copied the full export.');
    }
  } catch (e) {
    alert('Error parsing data: ' + e.message);
  }
}

let trackerWeekOffset = 0;

function renderTracker() {
  const base = new Date();
  base.setDate(base.getDate() + trackerWeekOffset * 7);
  const ws = weekStart(base);
  const we = weekEnd(base);

  const entries = state.entries
    .filter(e => {
      const active = e.endMs || (state.timer.running && e.id === state.timer.entryId);
      return active && e.startMs >= ws.getTime() && e.startMs <= we.getTime();
    })
    .sort((a, b) => b.startMs - a.startMs);

  const grouped = {};
  entries.forEach(e => {
    const d = new Date(e.startMs);
    d.setHours(0,0,0,0);
    const key = d.getTime();
    if (!grouped[key]) grouped[key] = [];
    grouped[key].push(e);
  });

  const days = Object.keys(grouped).sort((a,b) => b-a);
  const wsLabel = ws.toLocaleDateString('en-GB', { day:'numeric', month:'short' });
  const weLabel = we.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });

  document.getElementById('app-content').innerHTML = `
    <div class="content">
      ${quickTimerHTML()}

      <div style="display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;align-items:center">
        <button class="date-nav-btn" onclick="trackerWeekOffset--;renderTracker()" style="width:30px;height:30px;border-radius:6px;border:1px solid var(--border);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center">‹</button>
        <span style="font-size:14px;font-weight:600">${wsLabel} – ${weLabel}</span>
        <button class="date-nav-btn" onclick="if(trackerWeekOffset<0){trackerWeekOffset++;renderTracker()}" ${trackerWeekOffset===0?'disabled style="opacity:.4"':''} style="width:30px;height:30px;border-radius:6px;border:1px solid var(--border);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center">›</button>
        ${trackerWeekOffset!==0?`<button class="btn btn-ghost btn-sm" onclick="trackerWeekOffset=0;renderTracker()">Today</button>`:''}
      </div>
      ${days.length === 0 ? `<div class="empty-state"><div class="empty-icon">⏳</div><h3>No entries this week</h3><p>Use the timer above or add a manual entry.</p></div>` : days.map(dayKey => {
        const dayEntries = grouped[dayKey];
        const dayTotal = dayEntries.reduce((s,e) => s + entryDuration(e), 0);
        const d = new Date(parseInt(dayKey));
        const isToday = sameDay(d, new Date());
        const label = isToday ? 'Today' : d.toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'short' });
        return `<div style="margin-bottom:20px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border)">
            <span style="font-weight:700;color:var(--text)">${label}</span>
            <span style="font-weight:700;color:var(--text2)">${formatDuration(dayTotal)}</span>
          </div>
          ${dayEntries.map(e => entryRowHTML(e)).join('')}
        </div>`;
      }).join('')}
    </div>
  `;
}

        ${state.clients.map(c=>`<option value="${c.id}" ${p?.clientId===c.id?'selected':''}>${clientName(c.id)}</option>`).join('')}

}

function saveProject(existingId) {
  const name = document.getElementById('pr-name')?.value.trim();
  if (!name) return alert('Project name is required.');
  const clientId = document.getElementById('pr-client')?.value || null;
  const color = COLORS[Math.floor(Math.random() * COLORS.length)];
  if (existingId) {
    const p = state.projects.find(pr=>pr.id===existingId);
    if (p) Object.assign(p, { name, clientId });
  } else {
    state.projects.push({ id: uid(), name, clientId, color });
  }
  save(); closeModal(); renderProjects();
}

let reportWeekOffset = 0;
let reportMode = 'weekly';
let reportGroupBy = 'client';
let reportClientFilter = null;
let reportProjectFilter = null;

function exportToCSV() {
  const base = new Date();
  if (reportMode === 'weekly') {
    base.setDate(base.getDate() + reportWeekOffset * 7);
  } else {
    base.setMonth(base.getMonth() + reportWeekOffset);
  }
  const start = reportMode === 'weekly' ? weekStart(base).getTime() : monthStart(base).getTime();
  const end = reportMode === 'weekly' ? weekEnd(base).getTime() : monthEnd(base).getTime();
  const entries = state.entries.filter(e => e.endMs && e.startMs >= start && e.startMs <= end);

  let csv = 'Date,Time,Description,Client,Project,Task,Duration\n';
  entries.forEach(e => {
    const date = new Date(e.startMs).toLocaleDateString('en-GB');
    const time = formatTime(e.startMs);
    const duration = formatDuration(entryDuration(e));
    const client = clientName(e.clientId) || 'N/A';
    const project = projectName(e.projectId) || 'N/A';
    const task = taskName(e.taskId) || 'N/A';
    csv += `${date},${time},"${e.desc}",${client},${project},${task},${duration}\n`;
  });

  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `timesheet-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  alert('CSV exported successfully!');
}

function renderReports() {
  const base = new Date();
  if (reportMode === 'weekly') {
    base.setDate(base.getDate() + reportWeekOffset * 7);
  } else {
    base.setMonth(base.getMonth() + reportWeekOffset);
  }
  const start = reportMode === 'weekly' ? weekStart(base).getTime() : monthStart(base).getTime();
  const end = reportMode === 'weekly' ? weekEnd(base).getTime() : monthEnd(base).getTime();
  const ws = reportMode === 'weekly' ? weekStart(base) : monthStart(base);
  const we = reportMode === 'weekly' ? weekEnd(base) : monthEnd(base);

  let entries = state.entries.filter(e => e.endMs && e.startMs >= ws.getTime() && e.startMs <= we.getTime());

  if (reportClientFilter) {
    entries = entries.filter(e => e.clientId === reportClientFilter);
  }
  if (reportProjectFilter) {
    entries = entries.filter(e => e.projectId === reportProjectFilter);
  }

  const byGroup = {};

  entries.forEach(e => {
    let groupId;

    } else if (reportGroupBy === 'project') {
      groupId = e.projectId || '__none__';
    } else {
      groupId = e.taskId || '__none__';

  const groupRows = Object.entries(byGroup).sort((a,b) => b[1]-a[1]);

          <span style="font-size:14px;font-weight:600">${reportLabel} Report: ${wsLabel} – ${weLabel}</span>

          ${reportWeekOffset!==0?`<button class="btn btn-ghost btn-sm" onclick="reportWeekOffset=0;renderReports()">This ${reportMode === 'weekly' ? 'week' : 'month'}</button>`:''}
        </div>
        <select onchange="reportMode=this.value;reportWeekOffset=0;renderReports()" style="padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px;cursor:pointer">
          <option value="weekly" ${reportMode==='weekly'?'selected':''}>Weekly</option>
          <option value="monthly" ${reportMode==='monthly'?'selected':''}>Monthly</option>
        </select>
      </div>

      <div style="display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap">
        <select onchange="reportGroupBy=this.value;renderReports()" style="padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px;cursor:pointer">
          <option value="client" ${reportGroupBy==='client'?'selected':''}>Group by Client</option>
          <option value="project" ${reportGroupBy==='project'?'selected':''}>Group by Project</option>
          <option value="task" ${reportGroupBy==='task'?'selected':''}>Group by Task</option>
        </select>
        <select onchange="reportClientFilter=this.value||null;renderReports()" style="padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px;cursor:pointer">
          <option value="">All Clients</option>
          ${state.clients.map(c => `<option value="${c.id}" ${reportClientFilter===c.id?'selected':''}>${c.firstName} ${c.lastName}</option>`).join('')}
        </select>
        <select onchange="reportProjectFilter=this.value||null;renderReports()" style="padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px;cursor:pointer">
          <option value="">All Projects</option>
          ${state.projects.map(p => `<option value="${p.id}" ${reportProjectFilter===p.id?'selected':''}>${p.name}</option>`).join('')}
        </select>
        <button class="btn btn-sm" onclick="exportToCSV()" style="background:var(--green);color:white;border:none;cursor:pointer">📊 CSV Export</button>
        <button class="btn btn-sm" onclick="exportToPDF()" style="background:${state.isPremium?'var(--primary)':'var(--text3)'};color:white;border:none;cursor:pointer;opacity:${state.isPremium?'1':'.6'}" ${!state.isPremium?'title="Free tier limited to CSV download report only. Upgrade for unlimited clients, PDF export, Email report and more Premium features"':''}>📄 PDF Export</button>
        <button class="btn btn-sm" onclick="emailReport()" style="background:${state.isPremium?'var(--primary)':'var(--text3)'};color:white;border:none;cursor:pointer;opacity:${state.isPremium?'1':'.6'}" ${!state.isPremium?'title="Free tier limited to CSV download report only. Upgrade for unlimited clients, PDF export, Email report and more Premium features"':''}>✉️ Email Report</button>
      </div>

      <div class="stat-grid">
        <div class="stat-card">
          <div class="stat-label">TOTAL HOURS</div>
          <div class="stat-value">${formatDuration(totalMs)}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">HOURS (DEC)</div>
          <div class="stat-value">${(totalMs / 3600000).toFixed(2)}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">ENTRIES</div>
          <div class="stat-value">${entries.length}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">GROUPS</div>
          <div class="stat-value">${groupRows.length}</div>
        </div>
      </div>

      ${groupRows.length > 0 ? `
      <div class="card">
        <div style="padding:16px 18px;border-bottom:1px solid var(--border)">
          <span style="font-size:16px;font-weight:700">Time by ${reportGroupBy === 'client' ? 'Client' : reportGroupBy === 'project' ? 'Project' : 'Task'}</span>
        </div>
        <div style="padding:16px 18px">
          ${groupRows.map(([gid, ms]) => {
            const pct = totalMs > 0 ? Math.round((ms / totalMs) * 100) : 0;
            let name, color;
            if (reportGroupBy === 'client') {
              name = gid === '__none__' ? 'No Client' : clientName(gid);
              color = gid === '__none__' ? '#9ca3af' : clientColor(gid);
            } else if (reportGroupBy === 'project') {
              name = gid === '__none__' ? 'No Project' : projectName(gid);
              color = gid === '__none__' ? '#9ca3af' : projectColor(gid);
            } else {
              name = gid === '__none__' ? 'No Task' : taskName(gid);
              color = '#9ca3af';
            }
            return `<div style="margin-bottom:16px">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
                <div style="display:flex;align-items:center;gap:8px">
                  <span style="width:12px;height:12px;border-radius:50%;background:${color}"></span>
                  <span style="font-weight:600">${name}</span>
                </div>
                <span style="font-weight:700">${formatDuration(ms)}</span>
              </div>
              <div style="height:8px;background:var(--surface2);border-radius:4px;overflow:hidden">
                <div style="height:100%;width:${pct}%;background:${color};border-radius:4px;transition:width .3s"></div>

          }).join('')}

      </div>
      ` : ''}

      ${entries.length > 0 ? `
      <div class="card" style="margin-top:24px;overflow-x:auto">
        <div style="padding:16px 18px;border-bottom:1px solid var(--border)">
          <span style="font-size:14px;font-weight:700">Detailed Entries</span>
        </div>
        <table style="width:100%;border-collapse:collapse;font-size:12px">
          <thead>
            <tr style="border-bottom:1px solid var(--border);background:var(--surface2)">
              <th style="text-align:left;padding:10px 14px;font-weight:700;color:var(--text2);text-transform:uppercase;font-size:10px">DATE</th>
              <th style="text-align:left;padding:10px 14px;font-weight:700;color:var(--text2);text-transform:uppercase;font-size:10px">DESCRIPTION</th>
              <th style="text-align:left;padding:10px 14px;font-weight:700;color:var(--text2);text-transform:uppercase;font-size:10px">CLIENT</th>
              <th style="text-align:left;padding:10px 14px;font-weight:700;color:var(--text2);text-transform:uppercase;font-size:10px">PROJECT</th>
              <th style="text-align:left;padding:10px 14px;font-weight:700;color:var(--text2);text-transform:uppercase;font-size:10px">TASK</th>
              <th style="text-align:left;padding:10px 14px;font-weight:700;color:var(--text2);text-transform:uppercase;font-size:10px">START</th>
              <th style="text-align:left;padding:10px 14px;font-weight:700;color:var(--text2);text-transform:uppercase;font-size:10px">END</th>
              <th style="text-align:left;padding:10px 14px;font-weight:700;color:var(--text2);text-transform:uppercase;font-size:10px">DURATION</th>
              <th style="text-align:left;padding:10px 14px;font-weight:700;color:var(--text2);text-transform:uppercase;font-size:10px">HOURS (DEC)</th>
            </tr>
          </thead>
          <tbody>
            ${entries.map(e => {
              const d = new Date(e.startMs);
              const dateStr = d.getDate().toString().padStart(2,'0') + ' ' + (d.getMonth()+1).toString().padStart(2,'0') + ' ' + d.getFullYear();
              const h = d.getHours().toString().padStart(2,'0');
              const mn = d.getMinutes().toString().padStart(2,'0');
              const startStr = h + ':' + mn;
              const ed = new Date(e.endMs);
              const eh = ed.getHours().toString().padStart(2,'0');
              const emn = ed.getMinutes().toString().padStart(2,'0');
              const endStr = eh + ':' + emn;
              const dur = entryDuration(e);
              const decimalHours = (dur / 3600000).toFixed(2);
              return `<tr style="border-bottom:1px solid var(--border)">
                <td style="padding:10px 14px">${dateStr}</td>
                <td style="padding:10px 14px">${e.description || '—'}</td>
                <td style="padding:10px 14px">${e.clientId ? clientName(e.clientId) : '—'}</td>

function deleteTask(taskId) {
  if (!confirm('Delete this task?')) return;
  state.tasks = state.tasks.filter(t => t.id !== taskId);
  save();
  renderTasksPage();
}

function openTaskModal(id) {
  const t = id ? state.tasks.find(tk=>tk.id===id) : null;
  openModal('task-modal', `${t?'Edit':'New'} Task`, `
    <div class="form-group">
      <label>Name</label>
      <input id="tk-name" type="text" placeholder="Task name" value="${t?.name||''}">
    </div>
    <div class="form-group">
      <label>Project</label>
      <select id="tk-project">
        <option value="">No Project</option>
        ${state.projects.map(p=>`<option value="${p.id}" ${t?.projectId===p.id?'selected':''}>${p.name}</option>`).join('')}

  `, function() { saveTask(id); });
}

function saveTask(existingId) {
  const name = document.getElementById('tk-name')?.value.trim();
  if (!name) return alert('Task name is required.');
  const projectId = document.getElementById('tk-project')?.value || null;
  if (existingId) {
    const t = state.tasks.find(tk=>tk.id===existingId);
    if (t) Object.assign(t, { name, projectId });
  } else {
    state.tasks.push({ id: uid(), name, projectId });
  }
  save(); closeModal(); renderTasksPage();
}

let currentModalCallback = null;

function openModal(id, title, body, onSave) {
  currentModalCallback = onSave;
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = `${id}-overlay`;
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-header">
        <h3>${title}</h3>
        <button onclick="closeModal()" style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--text2)">×</button>
      </div>
      <div class="modal-body">${body}</div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="handleModalSave()">Save</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.onclick = (e) => { if (e.target === overlay) closeModal(); };
}

function handleModalSave() {
  if (currentModalCallback) {
    currentModalCallback();
  }
  closeModal();
}

function closeModal() {
  currentModalCallback = null;
  document.querySelectorAll('.modal-overlay').forEach(el => el.remove());
}

function toggleTheme() {
  state.theme = state.theme === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', state.theme);
  const label = document.getElementById('theme-label');
  if (label) label.textContent = state.theme === 'dark' ? '☀️ Light Mode' : '🌙 Dark Mode';
  save();
}
